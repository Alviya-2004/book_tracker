<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">Book Tracker</h1>
      <p class="app-subtitle">A simple, quiet shelf for your reading journey</p>
    </header>

    <main class="app-main">
      <!-- Search Bar -->
      <section class="search-section" aria-label="Search books">
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Search books by title or author..."
          autocomplete="off"
        >
      </section>

      <!-- Add Book Form -->
      <section class="form-section" aria-label="Add a new book">
        <form id="add-book-form" class="book-form" novalidate>
          <div class="form-group">
            <label for="book-title">Title</label>
            <input 
              type="text" 
              id="book-title" 
              name="title" 
              placeholder="e.g. The Great Gatsby"
            >
            <span class="error-message" id="title-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="book-author">Author</label>
            <input 
              type="text" 
              id="book-author" 
              name="author" 
              placeholder="e.g. F. Scott Fitzgerald"
            >
            <span class="error-message" id="author-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="book-status">Status</label>
            <select id="book-status" name="status">
              <option value="To read">To read</option>
              <option value="Reading">Reading</option>
              <option value="Finished">Finished</option>
            </select>
          </div>

          <button type="submit" id="add-book-btn" class="btn-primary">Add Book</button>
        </form>
      </section>

      <!-- Book List Section -->
      <section class="list-section" aria-label="Book collection">
        <div class="list-header">
          <svg class="shelf-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <h2 class="list-heading">Your Reading Shelf</h2>
        </div>

        <div id="book-list" class="book-list">
          <!-- Book cards will be dynamically rendered here -->
        </div>
      </section>
    </main>
  </div>
</body>
</html>
